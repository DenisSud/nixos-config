[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-typing"
version = "0.1.0"
description = "Local Parakeet TDT v3 voice typing for GNOME via IBus"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "sherpa-onnx", "PyGObject"]

[project.scripts]
parakeet-typing = "parakeet_typing.cli:main"

[tool.setuptools.packages.find]
include = ["parakeet_typing*"]
